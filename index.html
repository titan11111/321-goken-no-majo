<style>/* FC iOS Controller — 画面下25%専用・コピペ可（Press Start 2P 前提） */
:root {
  --fc-shell: #c8c8c8;
  --fc-shell-lo: #a8a8a8;
  --fc-shell-line: #707070;
  --fc-dpad: #2a2a2a;
  --fc-dpad-hi: #454545;
  --fc-dpad-lo: #181818;
  --fc-a: #e83800;
  --fc-a-lo: #a82800;
  --fc-b: #f8b800;
  --fc-b-lo: #c89000;
  --fc-sys: #505050;
  --fc-sys-lo: #303030;
  --fc-label: #1a1a1a;
}

.fc-control-deck {
  position: relative;
  flex: 0 0 25%;
  height: 25%;
  min-height: 0;
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: clamp(4px, 1.5vw, 10px);
  padding:
    6px
    max(8px, env(safe-area-inset-right, 8px))
    max(6px, env(safe-area-inset-bottom, 6px))
    max(8px, env(safe-area-inset-left, 8px));
  background: linear-gradient(180deg, var(--fc-shell) 0%, var(--fc-shell-lo) 100%);
  border-top: 3px solid var(--fc-shell-line);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
  overflow: hidden;
  touch-action: none;
}

.fc-control-deck::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent 3px,
    rgba(0, 0, 0, 0.025) 3px,
    rgba(0, 0, 0, 0.025) 4px
  );
}

.fc-deck-left,
.fc-deck-center,
.fc-deck-right {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  min-width: 0;
  height: 100%;
}

.fc-deck-left {
  flex: 1 1 38%;
  justify-content: flex-start;
}

.fc-deck-center {
  flex: 0 0 auto;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 0 2px;
}

.fc-deck-right {
  flex: 1 1 38%;
  justify-content: flex-end;
}

/* ---- 十字キー（ファミコン十字型） ---- */
.fc-dpad-wrap {
  width: min(42vw, calc(25dvh - 18px), 168px);
  height: min(42vw, calc(25dvh - 18px), 168px);
  min-width: 120px;
  min-height: 120px;
  display: grid;
  place-items: center;
  touch-action: none;
}

.fc-dpad {
  position: relative;
  width: 100%;
  height: 100%;
  touch-action: none;
  filter: drop-shadow(0 4px 0 rgba(0, 0, 0, 0.45));
}

.fc-dpad-v,
.fc-dpad-h {
  position: absolute;
  border: 2px solid var(--fc-dpad-lo);
  background: linear-gradient(180deg, var(--fc-dpad-hi), var(--fc-dpad));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

.fc-dpad-v {
  width: 36%;
  height: 100%;
  left: 32%;
  top: 0;
}

.fc-dpad-h {
  width: 100%;
  height: 36%;
  left: 0;
  top: 32%;
}

.fc-dpad-c {
  position: absolute;
  left: 30%;
  top: 30%;
  width: 40%;
  height: 40%;
  border: 2px solid var(--fc-dpad-lo);
  background: radial-gradient(circle at 35% 28%, #555, var(--fc-dpad-lo));
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.55);
  pointer-events: none;
}

.fc-dpad[data-up="1"] .fc-dpad-v {
  background: linear-gradient(0deg, #666, var(--fc-dpad-hi));
  box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.45);
}

.fc-dpad[data-down="1"] .fc-dpad-v {
  background: linear-gradient(180deg, #666, var(--fc-dpad-hi));
  box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.45);
}

.fc-dpad[data-left="1"] .fc-dpad-h {
  background: linear-gradient(90deg, #666, var(--fc-dpad-hi));
  box-shadow: inset 4px 0 8px rgba(0, 0, 0, 0.45);
}

.fc-dpad[data-right="1"] .fc-dpad-h {
  background: linear-gradient(270deg, #666, var(--fc-dpad-hi));
  box-shadow: inset -4px 0 8px rgba(0, 0, 0, 0.45);
}

.fc-dpad.pressed {
  transform: scale(0.98);
  filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.45)) brightness(1.05);
}

/* ---- SELECT / START ---- */
.fc-sysbtn {
  position: relative;
  width: clamp(52px, 14vw, 68px);
  height: clamp(22px, 6.5vw, 28px);
  min-width: 48px;
  min-height: 22px;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: linear-gradient(180deg, var(--fc-sys), var(--fc-sys-lo));
  box-shadow: 0 2px 0 #111, inset 0 1px 0 rgba(255, 255, 255, 0.18);
  color: #ddd;
  font-family: "Press Start 2P", monospace;
  font-size: clamp(5px, 1.8vw, 7px);
  letter-spacing: 0.04em;
  line-height: 1;
  touch-action: none;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.fc-sysbtn:active,
.fc-sysbtn.pressed {
  transform: translateY(2px);
  box-shadow: 0 0 0 #111, inset 0 2px 4px rgba(0, 0, 0, 0.45);
}

/* ---- A / B（ファミコン配色・斜め配置） ---- */
.fc-ab {
  position: relative;
  width: min(46vw, calc(25dvh - 10px), 188px);
  height: min(46vw, calc(25dvh - 10px), 188px);
  min-width: 128px;
  min-height: 128px;
}

.fc-abbtn {
  position: absolute;
  width: clamp(56px, 16vw, 72px);
  height: clamp(56px, 16vw, 72px);
  min-width: 48px;
  min-height: 48px;
  padding: 0;
  border: 3px solid rgba(0, 0, 0, 0.35);
  border-radius: 50%;
  touch-action: none;
  transition: transform 0.08s ease, box-shadow 0.08s ease;
}

.fc-abbtn i {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-family: "Press Start 2P", monospace;
  font-size: clamp(11px, 3.4vw, 14px);
  font-style: normal;
  color: rgba(0, 0, 0, 0.55);
  pointer-events: none;
}

.fc-abbtn-a {
  right: 0;
  top: 8%;
  background: radial-gradient(circle at 35% 28%, #ff6a40, var(--fc-a) 55%, var(--fc-a-lo));
  box-shadow: 0 5px 0 #5a1800, inset 0 1px 0 rgba(255, 255, 255, 0.35);
}

.fc-abbtn-b {
  left: 0;
  bottom: 8%;
  background: radial-gradient(circle at 35% 28%, #ffe060, var(--fc-b) 55%, var(--fc-b-lo));
  box-shadow: 0 5px 0 #6a4a00, inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.fc-abbtn:active,
.fc-abbtn.pressed {
  transform: translateY(4px) scale(0.96);
}

.fc-abbtn-a:active,
.fc-abbtn-a.pressed {
  box-shadow: 0 1px 0 #5a1800, inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.fc-abbtn-b:active,
.fc-abbtn-b.pressed {
  box-shadow: 0 1px 0 #6a4a00, inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

@media (max-width: 360px) {
  .fc-deck-center {
    gap: 6px;
  }

  .fc-sysbtn {
    width: 48px;
    height: 20px;
    font-size: 5px;
  }
}

@media (max-height: 620px) {
  .fc-dpad-wrap,
  .fc-ab {
    min-width: 108px;
    min-height: 108px;
  }
}

 <div class="vital"><div class="hudline"><b>GARUD <small>魔力 0</small></b><span id="hpText">120</span></div><div class="healthbar"><i id="hpFill"></i></div><div class="ragebar"><i id="rageFill"></i></div><small id="rageLabel">闘気 / 震撃</small></div>
 <div class="stageinfo"><span id="areaText">01 / 城外橋</span><b id="scoreText">000000</b></div>
</header>
<div id="utility"><button id="mute" aria-label="音を切り替え" title="音を切り替え">♪</button><button id="pause" aria-label="一時停止" title="一時停止">Ⅱ</button></div>
<div id="bossHud" class="hidden"><span>魔王 ヴェルグ <small id="bossPhase">THE LAST SPELL</small></span><div><i id="bossFill"></i></div></div>
<div id="combo" class="hidden"><b id="comboCount">0</b><span>HITS</span><small id="moveName"></small></div>
<div id="notice" aria-live="polite"></div>
<div id="title" class="overlay title">
 <div class="edition">TITANS ARCADE <span> / </span> 321</div>
 <div class="title-copy"><div class="eyebrow">魔 力 ゼ ロ の 反 逆 者</div><h1>剛拳<span>の</span>魔城</h1><div class="english">IRON <i>/</i> HEX</div><p>魔法がすべての世界で、<br>最後に残ったのは、この拳だった。</p></div>
 <div class="title-actions"><button id="start" class="primary">魔城へ挑む <span>→</span></button><div class="subactions"><button id="practice">鍛錬場</button><button id="guide">遊び方</button><button id="settingsTitle">設定</button></div><div class="bottom-caption">BELT-SCROLL ACTION <span>拳 × 魔法</span></div></div>
</div>
<div id="modal" class="overlay hidden"><div class="modal-card"><div class="eyebrow" id="modalLabel">CAMP / 休息</div><h2 id="modalTitle">ひと息、つこう。</h2><div id="modalBody"></div><div id="modalButtons"></div></div></div>
<div id="chapter" class="hidden"><small id="chapterNum"></small><strong id="chapterName"></strong><span id="chapterSub"></span></div>
<div id="trainingLabel" class="hidden">鍛錬場 <span>体力無限・全技を試せます</span></div>
</section>
<nav id="control-deck" class="fc-control-deck" aria-label="ゲーム操作">
<div class="deck-left"><div id="stick" role="button" tabindex="0" aria-label="8方向移動"><div class="stick-ring"></div><span class="n">▲</span><span class="s">▼</span><span class="w">◀</span><span class="e">▶</span><div id="nub"></div></div><span class="deck-caption">MOVE <small>WASD / ↑↓←→</small></span></div>
<div class="deck-center"><span class="deck-brand">IRON <i>/</i> HEX</span><span id="hint">押し続けて、3連撃</span><span id="perf">READY</span></div>
<div class="deck-right"><div class="minor-actions"><button id="burst" data-action="burst" class="action utility-action" aria-label="震撃 Uキー">震撃<small>U</small></button><button id="dash" data-action="dash" class="action utility-action" aria-label="回避 スペースキー">回避<small>SPACE</small></button></div><div class="main-actions"><button id="kick" data-action="kick" class="action kick" aria-label="キック Kキー">脚<small>K / X</small></button><button id="punch" data-action="punch" class="action punch" aria-label="パンチ Jキー">拳<small>J / Z</small></button></div></div>
</nav></main>
<script>'use strict';
const $=id=>document.getElementById(id);
const Store={get(k,d){try{return localStorage.getItem('tg.321.'+k)??d}catch{return d}},set(k,v){try{localStorage.setItem('tg.321.'+k,String(v))}catch{}}};
const Settings={mute:Store.get('mute','0')==='1',handed:Store.get('handed','right'),reduced:Store.get('reduced',matchMedia('(prefers-reduced-motion: reduce)').matches?'1':'0')==='1',quality:Store.get('quality','auto'),sensitivity:+Store.get('sensitivity','1')||1};
function applySettings(){document.body.classList.toggle('left-handed',Settings.handed==='left');$('mute').textContent=Settings.mute?'♪̸':'♪';$('mute').setAttribute('aria-pressed',String(Settings.mute));if(window.Sound)Sound.sync()}
const Input=(()=>{
 const sources=new Map(),queue=[];let ax=0,ay=0,pid=null;const times=[];
 const keys={KeyW:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right',KeyJ:'punch',KeyZ:'punch',KeyK:'kick',KeyX:'kick',Space:'dash',KeyL:'dash',KeyU:'burst',KeyC:'burst'};
 function held(a){for(const x of sources.values())if(x===a)return true;return false}
 function press(a,source,stamp=performance.now()){const was=held(a);sources.set(source,a);if(!was&&!['up','down','left','right'].includes(a)){queue.push({a,t:stamp});if(queue.length>8)queue.shift();window.onGameAction?.(a)}if(window.Sound)Sound.unlock();}
 function release(source){sources.delete(source)}
 function clear(){sources.clear();queue.length=0;pid=null;ax=ay=0;$('nub').style.transform='';document.querySelectorAll('.pressed').forEach(x=>x.classList.remove('pressed'))}
 document.querySelectorAll('[data-action]').forEach(el=>{
  const ids=new Set();el.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();ids.add(e.pointerId);try{el.setPointerCapture(e.pointerId)}catch{}el.classList.add('pressed');press(el.dataset.action,'p'+e.pointerId,performance.now())},{passive:false});
  const up=e=>{ids.delete(e.pointerId);release('p'+e.pointerId);if(!ids.size)el.classList.remove('pressed')};['pointerup','pointercancel','lostpointercapture'].forEach(k=>el.addEventListener(k,up));
 });
 function move(e){if(e.pointerId!==pid)return;const r=$('stick').getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width*.34),dy=(e.clientY-r.top-r.height/2)/(r.height*.34),l=Math.hypot(dx,dy);const strength=Math.min(1,Math.max(0,(l-.13)/.64)*Settings.sensitivity);ax=l?dx/l*strength:0;ay=l?dy/l*strength:0;$('nub').style.transform=`translate(${ax*r.width*.21}px,${ay*r.height*.21}px)`}
 $('stick').addEventListener('pointerdown',e=>{if(pid!==null)return;e.preventDefault();pid=e.pointerId;try{$('stick').setPointerCapture(pid)}catch{}move(e);window.Sound?.unlock()},{passive:false});
 const moveEvent=('onpointerrawupdate' in window)?'pointerrawupdate':'pointermove';$('stick').addEventListener(moveEvent,move,{passive:true});
 ['pointerup','pointercancel','lostpointercapture'].forEach(k=>$('stick').addEventListener(k,e=>{if(e.pointerId===pid){pid=null;ax=ay=0;$('nub').style.transform=''}}));
 document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const a=keys[e.code];if(a){e.preventDefault();if(!e.repeat)press(a,'k'+e.code)}else if(!e.repeat){if(['Escape','KeyP','Enter'].includes(e.code)){e.preventDefault();window.onPause?.()}if(e.code==='KeyM')$('mute').click()}});
 document.addEventListener('keyup',e=>release('k'+e.code));
 window.addEventListener('blur',()=>{clear();window.onAutoPause?.()});document.addEventListener('visibilitychange',()=>{if(document.hidden){clear();window.onAutoPause?.()}});window.addEventListener('pagehide',clear);
 document.addEventListener('dblclick',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());
 // Prevent multi-touch browser gestures only within gameplay controls; Pointer Events own all game actions.
 $('control-deck').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});$('control-deck').addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
 return{held,clear,queue,moveEvent,get axes(){let x=ax+(held('right')?1:0)-(held('left')?1:0),y=ay+(held('down')?1:0)-(held('up')?1:0),l=Math.hypot(x,y);return l>1?{x:x/l,y:y/l}:{x,y}},drain(){return queue.splice(0)},sample(t){times.push(performance.now()-t);if(times.length>120)times.shift()},get latency(){return times.length?times.reduce((a,b)=>a+b,0)/times.length:0}};
})();
$('mute').addEventListener('click',()=>{Settings.mute=!Settings.mute;Store.set('mute',Settings.mute?'1':'0');applySettings();window.Sound?.unlock()});$('pause').addEventListener('click',()=>window.onPause?.());applySettings();

// Extracted and adapted from 313-kyonin-kagemaru/game.js: clamp, lerp,
// depth scaling, foot-plane collision, nearest-facing and wave camera locks.
const Belt=(()=>{
 const clamp=(v,a,b)=>v<a?a:v>b?b:v;
 const lerp=(a,b,t)=>a+(b-a)*t;
 const depthScale=z=>.84+clamp(z,0,1)*.16;
 const sameLane=(a,b,tolerance=.15)=>Math.abs(a.z-b.z)<=tolerance;
 function nearest(p,es,range=180){let best=null,d=Infinity;for(const e of es){if(e.hp<=0)continue;const n=Math.abs(e.x-p.x)+Math.abs(e.z-p.z)*220;if(n<d&&n<range){best=e;d=n}}return best}
 class WaveGate{constructor(){this.index=0;this.active=false;this.lock=Infinity;this.min=0}begin(at){this.active=true;this.lock=at}clear(){this.active=false;this.min=this.lock;this.lock=Infinity;this.index++}camera(playerX,width){return clamp(playerX-width*.38,this.min,this.lock)}}
 return{clamp,lerp,depthScale,sameLane,nearest,WaveGate};
})();

(()=>{const canvas=$('screen'),c=canvas.getContext('2d');function draw(){const r=canvas.getBoundingClientRect();canvas.width=r.width*2;canvas.height=r.height*2;canvas.dataset.logicalWidth=r.width;canvas.dataset.logicalHeight=r.height;c.fillStyle='#142e2c';c.fillRect(0,0,canvas.width,canvas.height);requestAnimationFrame(draw)}requestAnimationFrame(draw);window.onPause=()=>{$('modal').classList.toggle('hidden')};})();
</script>
</body></html>
